# yandex-browser/flags.conf — dotfiles-owned low-RAM switches for Yandex
# Browser (os-rice §5), appended to every Exec= by modules/yandex-browser.sh.
# Overwritten on update. One switch per line; # starts a comment.
#
# Yandex Browser is Chromium, so the knob that dominates its RSS is the number
# of renderer processes, not a prefs file — there is no user.js equivalent.
# These are the Chromium counterparts of dotfiles/firefox/user.js.

# One renderer per SITE instead of one per tab. Ten tabs on the same site share
# a process (~100-150 MB each), and cross-site isolation is still enforced.
--process-per-site

# Hard ceiling on renderers, whatever the tab count. Chromium's own default
# scales with RAM and reaches 20+ on a 4 GB box. Raise to 6 if one heavy tab
# starts stalling the others.
--renderer-process-limit=4

# NOT enabled: --enable-low-end-device-mode. It is Chromium's small-machine
# profile, but it pays for the memory with precision — 4-bit RGBA4444 tiles and
# 16-bit RGB565 image decoding — which turns every dark gradient into visible
# bands. The process limits above cover the same RSS with no visual cost.

# Speculative connections and prerender trade RAM for latency.
--disable-features=Prerender2,PreconnectToSearch

# Cap the in-memory media cache; the disk cache takes over (Firefox: 64 MB).
--media-cache-size=33554432

# Belt and braces for the same banding: refuse 16-bit RGBA4444 tile textures
# even if a future build decides this machine counts as low-end on its own.
--disable-rgba-4444-textures

# Middle-click autoscroll is a Blink runtime feature with no chrome://flags or
# settings entry, so it can only be turned on from the command line -- and any
# --enable-blink-features pins an "unsupported command-line flag" infobar to
# every window. --test-type is the only switch that suppresses that bar
# (--disable-infobars is a no-op here; measured). It marks the session as an
# automated test, which also silences other notices and unlocks test-only
# switches such as --ignore-certificate-errors for anything that adds them
# later. It does not disable the sandbox. Remove this line to get the bar back.
--test-type
