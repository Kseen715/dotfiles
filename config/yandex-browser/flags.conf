# yandex-browser/flags.conf — dotfiles-owned low-RAM switches for Yandex
# Browser (os-rice §5), appended to every Exec= by modules/yandex-browser.sh.
# Overwritten on update. One switch per line; # starts a comment.
#
# Yandex Browser is Chromium, so these are the Chromium counterparts of
# dotfiles/firefox/user.js.
#
# NOT enabled, and this is the important part: --process-per-site and
# --renderer-process-limit. They look like the RSS knobs and they are the two
# switches that made this browser WORSE on both counts it was tuned for.
#
# Both work by putting more tabs in fewer renderers, and a renderer's memory
# only goes back to the kernel when the whole process exits. The browser's own
# tab unloading -- which is what is actually turned on in settings -- discards
# ONE tab and can free next to nothing while a sibling tab keeps the process
# alive, so the setting silently stops paying. Measured here: 12 renderers
# against a --renderer-process-limit=4, one of them 213 MB, because the limit
# is a hint that site isolation overrides rather than a ceiling -- all of the
# downside, none of the cap.
#
# The crashes come from the same place. A fat shared renderer is the one that
# meets the OOM killer, and it takes every tab sharing it down at once.
#
# Chromium's default process model (one renderer per site INSTANCE) is what
# tab unloading is designed against: unload a background tab, its process
# exits, the RAM is back. Leave the default alone.
#
# Also NOT enabled: --enable-low-end-device-mode. It is Chromium's
# small-machine profile, but it pays for the memory with precision — 4-bit
# RGBA4444 tiles and 16-bit RGB565 image decoding — which turns every dark
# gradient into visible bands.

# Speculative connections and prerender trade RAM for latency.
--disable-features=Prerender2,PreconnectToSearch

# Cap the in-memory media cache; the disk cache takes over (Firefox: 64 MB).
--media-cache-size=33554432

# Belt and braces for the same banding: refuse 16-bit RGBA4444 tile textures
# even if a future build decides this machine counts as low-end on its own.
--disable-rgba-4444-textures

# Middle-click autoscroll is a Blink runtime feature with no chrome://flags or
# settings entry, so it can only be turned on from the command line -- and any
# --enable-blink-features pins an "unsupported command-line flag" infobar to
# every window. --test-type is the only switch that suppresses that bar
# (--disable-infobars is a no-op here; measured). It marks the session as an
# automated test, which also silences other notices and unlocks test-only
# switches such as --ignore-certificate-errors for anything that adds them
# later. It does not disable the sandbox. Remove this line to get the bar back.
--test-type
