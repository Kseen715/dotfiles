# ~/.config/environment.d/90-qt.conf — Qt platform theme for session managers
# that never read ~/.xprofile.
#
# The xprofile layer (xprofile/10-session.sh) covers an i3/X11 session started
# from startx or a DM that sources it. GNOME/KDE on Wayland do not: they start
# apps from the systemd user session, which reads only these files. Without it
# Qt apps fall back to the default light palette — VLC's dark toolbar with white
# menus is the usual first sighting.
#
# qt5ct, not qt6ct: the qt6ct plugin registers both keys and still reads its own
# ~/.config/qt6ct, while the Qt5 plugin answers to `qt5ct` only, so this one
# value themes Qt5 and Qt6 apps alike.
QT_QPA_PLATFORMTHEME=qt5ct
