#
# picom/picom.conf — dotfiles-owned base layer (os-rice §5).
# Behaviour: backend, vsync, blur method, exclusion lists. The rice owns
# 90-theme.conf (corner radius, opacity, shadow color), @included at the bottom.
#

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
# Leaving unredirection on causes corner/blur artifacts when a fullscreen window
# takes over the screen; the cost is a few percent on fullscreen games.
unredir-if-possible = false;

#
# Blur — dual_kawase is the cheap wide-radius kernel; strength lives in the rice.
#
blur-method = "dual_kawase";
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'i3-frame'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@",
    "_PICOM_SKIP_BLUR@"
];

#
# Fading
#
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
no-fading-openclose = false;

fade-exclude = [
    "class_g = 'flameshot'",
    "class_g = 'slop'"
];

#
# Shadows
#
shadow = true;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'i3-frame'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@"
];

#
# Never composite the screenshot tools — a blurred/faded overlay is exactly what
# you do not want to capture.
#
focus-exclude = [
    "class_g = 'flameshot'",
    "class_g = 'slop'",
    "class_g = 'Steam'"
];

#
# Hidden tabs. i3 does NOT unmap the windows a tabbed or stacked container is
# not showing - it stacks them and raises the visible one, and sets
# _NET_WM_STATE_HIDDEN on the rest. Without a compositor that is invisible,
# because the top window is opaque. With one, and with a translucent terminal,
# every hidden tab shows THROUGH the visible one: two shells blended into each
# other, reported as "all tabs of the pane render simultaneously, I can see
# both". Measured as the mean pixel inside the pane: (30,31,33) with two
# terminals stacked against (38,37,40) with one, on a rice whose terminals are
# 0.85 opaque.
#
# Painting them at zero is the fix, and it belongs to the window state rather
# than to any application: anything i3 hides is hidden, terminal or not.
opacity-rule = [
    "0:_NET_WM_STATE@[0] *= '_NET_WM_STATE_HIDDEN'"
];

rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'Polybar'",
    # rofi rounds itself (border-radius in launcher.rasi) on a 32-bit visual.
    # Rounding it a second time here, at a different radius, is what leaves the
    # dark crescent between picom's corner and rofi's own.
    "class_g = 'Rofi'",

    # No gap to round into. i3's `smart_gaps on` drops the gaps when a workspace
    # holds a single window, so that window reaches the screen edges - and a
    # rounded corner there is cut against the edge of the display instead of
    # showing the wallpaper through it. Same for a fullscreened window.
    #
    # Keyed on x rather than on the window's size because picom has no variable
    # for the screen's dimensions to compare a size against. Measured on this
    # setup: a gapless window sits at x=1 (i3's 1px border), a gapped one at
    # x=17 (outer 4 + inner 10 + border). Anything under 8 is therefore "flush
    # against the edge", which also catches true fullscreen at x=0.
    #
    # This makes the rule track the gaps rather than the resolution: set `gaps
    # outer 0` and nothing rounds, which is the same intent one step further.
    "x < 8"
];

#
# Rice-owned theme layer (corner radius, opacity, shadow color, blur strength).
# picom resolves @include relative to this file, so both live in ~/.config/picom/.
#
@include "90-theme.conf"
