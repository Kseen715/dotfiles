# evolution/gsettings.conf — dotfiles-owned Evolution behaviour (os-rice §5),
# applied by modules/evolution.sh. Format: <schema> <key> <value>
#
# Values are GVariant literals, so strings need their own quotes: 'like this'.
# A key the installed Evolution does not have is skipped with a count, not an
# error - the schema changes between releases and this file outlives them.
#
# This half is layout and habits. Colors and fonts are the rice's half
# (rices/<name>/config/evolution/gsettings.conf).

# --- layout: the single biggest "looks modern" change -------------------------
# 1 = vertical view: folder list | message list | preview, side by side. The
# classic 0 (list on top, preview below) is what makes Evolution read as old.
org.gnome.evolution.mail layout 1
org.gnome.evolution.mail show-preview true
org.gnome.evolution.mail show-to-do-bar false
org.gnome.evolution.mail paned-vertical-size 480

# Chrome that a tiling WM already provides or that is pure clutter.
org.gnome.evolution.shell menubar-visible false
org.gnome.evolution.shell toolbar-visible true
org.gnome.evolution.shell sidebar-visible true
org.gnome.evolution.shell statusbar-visible false
org.gnome.evolution.shell buttons-style 'icons'

# --- message list -------------------------------------------------------------
# Threaded by conversation, newest at the bottom of the thread, and no
# "mark as read the instant the cursor lands on it".
org.gnome.evolution.mail thread-subject false
org.gnome.evolution.mail mark-seen true
org.gnome.evolution.mail mark-seen-timeout 1500
org.gnome.evolution.mail show-deleted false
org.gnome.evolution.mail headers-collapsed false

# --- privacy ------------------------------------------------------------------
# 0 = never load remote images (tracking pixels), 1 = only from known contacts,
# 2 = always. 1 is the sane default: newsletters stay broken, people do not.
org.gnome.evolution.mail image-loading-policy 1
org.gnome.evolution.mail search-gravatar-for-header false
org.gnome.evolution.mail composer-magic-smileys false

# --- composer -----------------------------------------------------------------
# Reply below the quote (what everyone outside corporate email expects), plain
# text by default so mail from this machine is readable everywhere.
org.gnome.evolution.mail composer-reply-start-bottom true
org.gnome.evolution.mail composer-top-signature false
org.gnome.evolution.mail composer-inline-spelling true
