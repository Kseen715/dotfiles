# mpv/mpv.conf — dotfiles-owned base (os-rice §5). Playback behaviour only;
# OSD colors are the rice's 90-theme.conf, included at the bottom.

profile=gpu-hq
vo=gpu
hwdec=auto-safe          # uses the VA-API/VDPAU stack from modules/codecs.sh
keep-open=yes
save-position-on-quit=yes
volume=90
volume-max=150

# Subtitles
sub-auto=fuzzy
sub-font='Noto Sans'
sub-font-size=42
sub-border-size=2.4

# Screenshots land where xdg-user-dirs put Pictures (modules/xdg.sh).
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template=mpv-%F-%wH%wM%wS

# YouTube etc. without pulling 4K on a laptop panel.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

include=~/.config/mpv/90-theme.conf
