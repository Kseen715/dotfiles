# libinput-gestures.conf — dotfiles-owned (os-rice §5). Three- and four-finger
# swipes mapped onto i3. Requires the user to be in the `input` group, which
# modules/input.sh arranges; log out and back in for it to take effect.
#
# Test what your touchpad actually reports with: libinput-gestures -d

# Three fingers: move between workspaces.
gesture swipe left  3 i3-msg workspace next_on_output
gesture swipe right 3 i3-msg workspace prev_on_output

# Three fingers up/down: overview-ish and scratchpad.
gesture swipe up    3 i3-msg fullscreen toggle
gesture swipe down  3 i3-msg scratchpad show

# Four fingers: window management.
gesture swipe left  4 i3-msg move container to workspace next_on_output
gesture swipe right 4 i3-msg move container to workspace prev_on_output
gesture swipe up    4 ~/.config/i3/scripts/layout.sh toggle-split
gesture swipe down  4 i3-msg kill

# Pinch: floating toggle.
gesture pinch in    2 i3-msg floating enable
gesture pinch out   2 i3-msg floating disable
