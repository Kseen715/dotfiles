# xsettingsd.conf — rice-owned (void-i3-rosemuted). xsettingsd is the settings
# daemon i3 does not have (i3-sugg §4.1): it pushes theme/font/DPI to running
# GTK2/GTK3 apps over XSETTINGS. Live-reload with `killall -HUP xsettingsd`.
# Swapped on rice switch (§6).

Net/ThemeName "Adwaita-dark"
Net/IconThemeName "Papirus-Dark"
Gtk/CursorThemeName "Vanilla-DMZ"
Gtk/CursorThemeSize 24
Gtk/FontName "Noto Sans 10"
Gtk/EnableAnimations 1
Gtk/DecorationLayout "menu:minimize,maximize,close"

# Xft/DPI is in 1024ths: 96 * 1024 = 98304.
Xft/DPI 98304
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
