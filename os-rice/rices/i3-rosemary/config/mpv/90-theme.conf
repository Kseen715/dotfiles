# 90-theme.conf — rice-owned mpv OSD/OSC colors (void-i3-rosemuted). Included by
# the dotfiles-owned mpv.conf. Swapped on rice switch (§6).
# mpv wants colors as #AARRGGBB (alpha first, 00 = opaque).

osd-font='JetBrainsMono Nerd Font'
osd-font-size=32
osd-color='#00e8dfe1'
osd-border-color='#001c1f20'
osd-border-size=2
osd-bar-align-y=0.85
osd-bar-h=2.2
osd-bar-w=60

# The seek bar is the one accent surface.
osd-back-color='#801c1f20'
background-color='#001c1f20'

sub-color='#00e8dfe1'
sub-border-color='#001c1f20'

# On-screen controller
script-opts-append=osc-layout=slimbox
script-opts-append=osc-seekbarstyle=bar
