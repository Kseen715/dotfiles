# lightdm-gtk-greeter.conf — rice-owned (void-i3-rosemuted), installed to
# /etc/lightdm/ by modules/lightdm.sh (root: the greeter runs before your home
# is available, so it cannot read ~/.config).
#
# {{WALLPAPER_PATH}} is substituted with the installed wallpaper. If the greeter
# shows grey instead, the file is in a directory its user cannot read — put the
# image somewhere world-readable such as /usr/share/backgrounds/.

[greeter]
background = {{WALLPAPER_PATH}}
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
cursor-theme-name = Vanilla-DMZ
cursor-theme-size = 24
font-name = Noto Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %H:%M
position = 50%,center 55%,center
user-background = false
default-user-image = #avatar-default
hide-user-image = false
screensaver-timeout = 60
