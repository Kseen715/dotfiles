# gsettings.conf — rice-owned Evolution appearance (void-i3-rosemuted), applied
# by modules/evolution.sh. Swapped on rice switch (§6). Format: <schema> <key> <value>
#
# The behaviour half (layout, privacy, composer) is dotfiles-owned in
# dotfiles/evolution/gsettings.conf.

# --- the key that makes a dark theme actually work ----------------------------
# HTML mail ships its own colors, so on a dark desktop every second message is a
# blinding white rectangle. This drops the sender's colors and renders the body
# in the desktop palette instead. If your Evolution is too old to have it, the
# module reports it as "not present in this version" and the rest still applies.
org.gnome.evolution.mail preview-unset-html-colors true

# --- fonts: follow the desktop, then override the monospace half ---------------
# use-custom-font false = inherit the GTK font (Noto Sans 10 from the rice's
# gtk-3.0/settings.ini), which is the whole point of having a settings daemon.
org.gnome.evolution.mail use-custom-font false
org.gnome.evolution.mail variable-width-font 'Noto Sans 10'
org.gnome.evolution.mail monospace-font 'JetBrainsMono Nerd Font 10'

# Citations (quoted text) get the rice's muted rose instead of the default blue.
org.gnome.evolution.mail mark-citations true
org.gnome.evolution.mail citation-color '#d98cae'

# Message labels are deliberately NOT set here. Their serialization has changed
# across Evolution releases and a wrong value would fail on every run without
# changing anything - set label colors in Preferences -> Mail Preferences ->
# Labels, where they are user data anyway.
