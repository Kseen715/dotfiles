# arch-hyprland-glass WezTerm palette — rice-owned theme layer (90-*, swapped on rice switch,
# §6). Installed to ~/.config/wezterm/colors/osr-rice.toml; the dotfiles-owned
# .wezterm.lua selects it with color_scheme = "osr-rice". Same 16 colors as this
# rice's ghostty palette (config/ghostty/ghostty-theme).

[metadata]
name = "osr-rice"

[colors]
background = "#181818"
foreground = "#ffffff"
cursor_bg = "#ffffff"
cursor_border = "#ffffff"
cursor_fg = "#181818"
selection_bg = "#303030"
selection_fg = "#ffffff"
ansi = ["#1e1e1e", "#be0f17", "#338716", "#d4c310", "#185b8f", "#a12b84", "#578f8d", "#bbbbbb"]
brights = ["#525252", "#f0424b", "#55dc28", "#f3e659", "#3292dc", "#d45eb7", "#90bbba", "#ededed"]
