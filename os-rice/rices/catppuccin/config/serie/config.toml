# catppuccin (mocha) serie theme — rice-owned theme layer (90-*, swapped on rice
# switch, §6). Same 16 colors as this rice's ghostty palette.

# fg/bg are left at "Reset" (the terminal's own colors), so serie inherits the
# terminal background and stays transparent.

[color]
fg = "Reset"
bg = "Reset"

list_selected_fg = "#cdd6f4"
list_selected_bg = "#585b70"
list_ref_paren_fg = "#585b70"
list_ref_branch_fg = "#a6e3a1"
list_ref_remote_branch_fg = "#f38ba8"
list_ref_tag_fg = "#f9e2af"
list_ref_stash_fg = "#f5c2e7"
list_head_fg = "#94e2d5"
list_subject_fg = "Reset"
list_name_fg = "#94e2d5"
list_hash_fg = "#f9e2af"
list_date_fg = "#f5c2e7"
list_match_fg = "#1e1e2e"
list_match_bg = "#f9e2af"

detail_label_fg = "#bac2de"
detail_name_fg = "#94e2d5"
detail_date_fg = "#f5c2e7"
detail_email_fg = "#89b4fa"
detail_hash_fg = "#f9e2af"
detail_ref_branch_fg = "#a6e3a1"
detail_ref_remote_branch_fg = "#f38ba8"
detail_ref_tag_fg = "#f9e2af"
detail_file_change_add_fg = "#a6e3a1"
detail_file_change_modify_fg = "#f9e2af"
detail_file_change_delete_fg = "#f38ba8"
detail_file_change_move_fg = "#f5c2e7"

ref_selected_fg = "#cdd6f4"
ref_selected_bg = "#585b70"

help_block_title_fg = "#a6e3a1"
help_key_fg = "#f9e2af"

virtual_cursor_fg = "#94e2d5"
status_input_fg = "#cdd6f4"
status_input_transient_fg = "#585b70"
status_info_fg = "#94e2d5"
status_success_fg = "#a6e3a1"
status_warn_fg = "#f9e2af"
status_error_fg = "#f38ba8"
divider_fg = "#585b70"

# Commit graph edge colors, cycled per branch. edge/background stay at their
# transparent defaults so the graph image blends into the terminal.
[graph.color]
branches = ["#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5"]
