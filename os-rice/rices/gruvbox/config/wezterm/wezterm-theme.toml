# gruvbox WezTerm palette — rice-owned theme layer (90-*, swapped on rice switch,
# §6). Installed to ~/.config/wezterm/colors/osr-rice.toml; the dotfiles-owned
# .wezterm.lua selects it with color_scheme = "osr-rice". Same 16 colors as this
# rice's ghostty palette (config/ghostty/ghostty-theme).

[metadata]
name = "osr-rice"

[colors]
background = "#282828"
foreground = "#ebdbb2"
cursor_bg = "#ebdbb2"
cursor_border = "#ebdbb2"
cursor_fg = "#282828"
selection_bg = "#504945"
selection_fg = "#ebdbb2"
ansi = ["#282828", "#cc241d", "#98971a", "#d79921", "#458588", "#b16286", "#689d6a", "#a89984"]
brights = ["#928374", "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c", "#ebdbb2"]
