# nord serie theme — rice-owned theme layer (90-*, swapped on rice switch, §6).
# Same 16 colors as this rice's ghostty palette.

# fg/bg are left at "Reset" (the terminal's own colors), so serie inherits the
# terminal background and stays transparent.

[color]
fg = "Reset"
bg = "Reset"

list_selected_fg = "#d8dee9"
list_selected_bg = "#434c5e"
list_ref_paren_fg = "#4c566a"
list_ref_branch_fg = "#a3be8c"
list_ref_remote_branch_fg = "#bf616a"
list_ref_tag_fg = "#ebcb8b"
list_ref_stash_fg = "#b48ead"
list_head_fg = "#8fbcbb"
list_subject_fg = "Reset"
list_name_fg = "#88c0d0"
list_hash_fg = "#ebcb8b"
list_date_fg = "#b48ead"
list_match_fg = "#2e3440"
list_match_bg = "#ebcb8b"

detail_label_fg = "#e5e9f0"
detail_name_fg = "#8fbcbb"
detail_date_fg = "#b48ead"
detail_email_fg = "#81a1c1"
detail_hash_fg = "#ebcb8b"
detail_ref_branch_fg = "#a3be8c"
detail_ref_remote_branch_fg = "#bf616a"
detail_ref_tag_fg = "#ebcb8b"
detail_file_change_add_fg = "#a3be8c"
detail_file_change_modify_fg = "#ebcb8b"
detail_file_change_delete_fg = "#bf616a"
detail_file_change_move_fg = "#b48ead"

ref_selected_fg = "#d8dee9"
ref_selected_bg = "#434c5e"

help_block_title_fg = "#a3be8c"
help_key_fg = "#ebcb8b"

virtual_cursor_fg = "#8fbcbb"
status_input_fg = "#d8dee9"
status_input_transient_fg = "#4c566a"
status_info_fg = "#8fbcbb"
status_success_fg = "#a3be8c"
status_warn_fg = "#ebcb8b"
status_error_fg = "#bf616a"
divider_fg = "#4c566a"

# Commit graph edge colors, cycled per branch. edge/background stay at their
# transparent defaults so the graph image blends into the terminal.
[graph.color]
branches = ["#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#8fbcbb"]
