# Wallpaper setup!
# To reload when you update config: Run `killall hyprpaper` and then `hyperpaper & disown`

# run `hyprctl monitors all` to see all your monitors!!! In order to create your setup.

# {{WALLPAPER_PATH}} is substituted at install time by modules/hyprpaper.sh with
# the wallpaper this rice ships, copied into ~/Pictures/Wallpapers.
preload = {{WALLPAPER_PATH}}

wallpaper = ,{{WALLPAPER_PATH}}
# wallpaper = DP-3,/home/username/Wallpapers/example.png