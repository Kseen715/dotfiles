# catppuccin WezTerm palette — rice-owned theme layer (90-*, swapped on rice switch,
# §6). Installed to ~/.config/wezterm/colors/osr-rice.toml; the dotfiles-owned
# .wezterm.lua selects it with color_scheme = "osr-rice". Same 16 colors as this
# rice's ghostty palette (config/ghostty/ghostty-theme).

[metadata]
name = "osr-rice"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor_bg = "#f5e0dc"
cursor_border = "#f5e0dc"
cursor_fg = "#1e1e2e"
selection_bg = "#585b70"
selection_fg = "#cdd6f4"
ansi = ["#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de"]
brights = ["#585b70", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8"]
