# 90-theme.conf — theme-owned dunst theme (§6b). Installed to
# ~/.config/dunst/dunstrc.d/, which dunst merges AFTER the base dunstrc, so
# everything here wins. Swapped on theme switch (§6).
#
# A file rather than the rendered dotfiles/dunst/90-theme.conf.tmpl, because
# this rice squares every corner and the radius lives in the dotfiles base
# dunstrc (corner_radius = 12), which is shared with every other rice. A
# theme's own file wins over the template (lib/render.c osr_theme_source), so
# the palette below is the rendered rosemary one plus the one line that differs.

[global]
    # Square corners, matching picom's corner-radius = 0 and this rice's rofi
    # layouts. Overrides corner_radius = 12 in the dotfiles base dunstrc.
    corner_radius = 0
    font = "JetBrainsMono Nerd Font Medium 10"
    frame_color = "#d98cae"
    separator_color = frame
    highlight = "#d98cae"

[urgency_low]
    background = "#1c1f20"
    foreground = "#8d8386"
    frame_color = "#34393b"

[urgency_normal]
    background = "#1c1f20"
    foreground = "#e8dfe1"
    frame_color = "#d98cae"

# Critical keeps the hot pink from the reference dotfiles: this is the one that
# is allowed to shout.
[urgency_critical]
    background = "#24282a"
    foreground = "#e8dfe1"
    frame_color = "#f15495"
