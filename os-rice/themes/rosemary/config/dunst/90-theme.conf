# 90-theme.conf — rice-owned dunst theme (void-i3-rosemuted). Installed to
# ~/.config/dunst/dunstrc.d/, which dunst merges AFTER the base dunstrc, so
# everything here wins. Swapped on rice switch (§6).

[global]
    font = "JetBrainsMono Nerd Font Medium 10"
    frame_color = "#d98cae"
    separator_color = frame
    highlight = "#d98cae"

[urgency_low]
    background = "#1c1f20"
    foreground = "#8d8386"
    frame_color = "#34393b"

[urgency_normal]
    background = "#1c1f20"
    foreground = "#e8dfe1"
    frame_color = "#d98cae"

# Critical keeps the hot pink from the reference dotfiles: this is the one that
# is allowed to shout.
[urgency_critical]
    background = "#24282a"
    foreground = "#e8dfe1"
    frame_color = "#f15495"
