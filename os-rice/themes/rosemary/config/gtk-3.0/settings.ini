[Settings]
# Rice-owned (void-i3-rosemuted), swapped on rice switch (§6).
# Adwaita-dark comes from gnome-themes-extra (logical name gtk-dark-theme);
# the rose accents are layered on top by gtk.css, so no third-party GTK theme
# has to be vendored — none of the pink ones are packaged on Void anyway.
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Vanilla-DMZ
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-menu-images=1
gtk-button-images=1
gtk-enable-animations=1
gtk-primary-button-warps-slider=0
