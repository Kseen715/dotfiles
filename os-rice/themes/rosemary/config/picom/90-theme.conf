#
# 90-theme.conf — rice-owned picom theme (i3-rosemary). @included by the
# dotfiles-owned picom.conf, so anything set here wins. Swapped on switch (§6).
#

# Square corners. This rice is deliberately unrounded: every surface that can
# round itself (rofi, dunst) is set to 0 in this theme's own layers, and picom
# must agree or the WINDOWS would be the only rounded thing on screen.
corner-radius = 0;

blur-strength = 5;

active-opacity = 1.0;
inactive-opacity = 0.94;
frame-opacity = 1.0;
inactive-dim = 0.06;

# Terminals and the bar get the muted-glass look; anything that renders media or
# color-critical work stays fully opaque.
opacity-rule = [
    # FIRST, and not a look: a rice that sets opacity-rule REPLACES the base
    # list wholesale, so the hidden-tab rule the base carries has to be
    # repeated here or a tabbed container shows every tab at once through the
    # visible one. See the base picom.conf for the measurement.
    "0:_NET_WM_STATE@[0] *= '_NET_WM_STATE_HIDDEN'",
    "92:class_g = 'Alacritty'",
    "92:class_g = 'Ghostty'",
    "92:class_g = 'org.wezfurlong.wezterm'",
    "90:class_g = 'Polybar'",
    "95:class_g = 'Rofi'",
    "100:class_g = 'firefox'",
    "100:class_g = 'mpv'",
    "100:class_g = 'obs'",
    "100:fullscreen"
];

shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
# A rose-tinted shadow instead of black — the whole point of the palette.
shadow-color = "#120d10";
