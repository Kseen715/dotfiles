# rosemuted WezTerm palette — rice-owned theme layer (90-*, swapped on rice
# switch, §6). Installed to ~/.config/wezterm/colors/osr-rice.toml; the
# dotfiles-owned .wezterm.lua selects it with color_scheme = "osr-rice".
# Same 16 colors as this rice's ghostty palette.

[metadata]
name = "osr-rice"

[colors]
background = "#1c1f20"
foreground = "#e8dfe1"
cursor_bg = "#d98cae"
cursor_border = "#d98cae"
cursor_fg = "#1c1f20"
selection_bg = "#34393b"
selection_fg = "#e8dfe1"
ansi = ["#1c1f20", "#e2655e", "#9fb08a", "#d9b48f", "#8f95bd", "#d98cae", "#8fb3b0", "#e8dfe1"]
brights = ["#4e5456", "#ef7d76", "#b6c6a1", "#eccba7", "#a7adcf", "#eda6c4", "#a8c9c6", "#ffffff"]
