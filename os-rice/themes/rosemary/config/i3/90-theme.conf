# 90-theme.conf — rice-owned i3 theme layer (void-i3-rosemuted).
# Swapped on rice switch (§6); the keybinds and rules in ~/.config/i3/config are
# untouched by a switch, and 99-local.conf still gets the last word.
#
# rosemuted palette
#   bg      #1c1f20   bg-alt  #24282a   sel     #34393b   muted   #4e5456
#   fg      #e8dfe1   fg-dim  #b3a8ab   accent  #d98cae   urgent  #f15495
#   red     #e2655e   orange  #d3877a   yellow  #d9b48f   green   #9fb08a
#   cyan    #8fb3b0   blue    #8f95bd

set $bg      #1c1f20
set $bg_alt  #24282a
set $sel     #34393b
set $muted   #4e5456
set $fg      #e8dfe1
set $fg_dim  #b3a8ab
set $accent  #d98cae
set $urgent  #f15495

font pango:JetBrainsMono Nerd Font Medium 10

gaps inner 10
gaps outer 4
smart_gaps on
smart_borders on
default_border pixel 2
default_floating_border pixel 2
title_align center

# Property                border   background  text     indicator  child_border
client.focused           $accent  $bg_alt     $fg      $accent    $accent
client.focused_inactive  $sel     $bg         $fg_dim  $sel       $sel
client.unfocused         $bg_alt  $bg         $muted   $bg_alt    $bg_alt
client.urgent            $urgent  $urgent     $bg      $urgent    $urgent
client.placeholder       $bg_alt  $bg         $fg_dim  $bg_alt    $bg_alt
client.background        $bg

# Wallpaper. {{WALLPAPER_PATH}} is substituted by install_wallpaper_layer with
# the copy in ~/Pictures/Wallpapers, so the path survives moving the dotfiles
# checkout. A rice with no wallpaper substitutes empty and feh just does nothing.
exec_always --no-startup-id feh --no-fehbg --bg-fill {{WALLPAPER_PATH}}
