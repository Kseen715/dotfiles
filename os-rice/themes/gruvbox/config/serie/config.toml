# gruvbox (dark, medium contrast) serie theme — rice-owned theme layer (90-*,
# swapped on rice switch, §6). Same 16 colors as this rice's ghostty palette.

# fg/bg are left at "Reset" (the terminal's own colors), so serie inherits the
# terminal background and stays transparent.

[color]
fg = "Reset"
bg = "Reset"

list_selected_fg = "#ebdbb2"
list_selected_bg = "#504945"
list_ref_paren_fg = "#928374"
list_ref_branch_fg = "#b8bb26"
list_ref_remote_branch_fg = "#fb4934"
list_ref_tag_fg = "#fabd2f"
list_ref_stash_fg = "#d3869b"
list_head_fg = "#8ec07c"
list_subject_fg = "Reset"
list_name_fg = "#689d6a"
list_hash_fg = "#d79921"
list_date_fg = "#b16286"
list_match_fg = "#282828"
list_match_bg = "#fabd2f"

detail_label_fg = "#a89984"
detail_name_fg = "#8ec07c"
detail_date_fg = "#d3869b"
detail_email_fg = "#83a598"
detail_hash_fg = "#fabd2f"
detail_ref_branch_fg = "#b8bb26"
detail_ref_remote_branch_fg = "#fb4934"
detail_ref_tag_fg = "#fabd2f"
detail_file_change_add_fg = "#b8bb26"
detail_file_change_modify_fg = "#fabd2f"
detail_file_change_delete_fg = "#fb4934"
detail_file_change_move_fg = "#d3869b"

ref_selected_fg = "#ebdbb2"
ref_selected_bg = "#504945"

help_block_title_fg = "#b8bb26"
help_key_fg = "#fabd2f"

virtual_cursor_fg = "#8ec07c"
status_input_fg = "#ebdbb2"
status_input_transient_fg = "#928374"
status_info_fg = "#8ec07c"
status_success_fg = "#b8bb26"
status_warn_fg = "#fabd2f"
status_error_fg = "#fb4934"
divider_fg = "#928374"

# Commit graph edge colors, cycled per branch. edge/background stay at their
# transparent defaults so the graph image blends into the terminal.
[graph.color]
branches = ["#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c"]
