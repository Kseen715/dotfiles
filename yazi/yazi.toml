# yazi.toml — dotfiles-owned base config (rice-independent), installed to
# ~/.config/yazi/yazi.toml by os-rice/modules/yazi.sh.
#
# Intentionally minimal: it overrides ONLY the settings that differ from yazi's
# compiled-in defaults. Everything else is left unset so the built-in preset
# applies — the preset ships inside the yazi binary and tracks the installed
# version, so it never drifts out of schema (the old habit of copying the whole
# default preset here is exactly what broke on the yazi 26.x `name`->`url` /
# `[manager]`->`[mgr]` renames). Add a key here only to change a real default.

[mgr]
show_hidden = true      # default false — show dotfiles

[preview]
wrap = "yes"            # default "no" — wrap long lines in text previews
