;; polybar/modules.ini — dotfiles-owned module definitions (os-rice §5).
;; Every color is a ${color.*} reference into the rice-owned colors.ini.
;; Glyphs come from the Nerd Font declared in config.ini.

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

label-focused = %name%
label-focused-foreground = ${color.background}
label-focused-background = ${color.accent}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${color.muted}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${color.foreground}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${color.background}
label-urgent-background = ${color.urgent}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:70:...%
label-foreground = ${color.muted}

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${color.foreground}
;; Click the clock for a calendar popup (gsimplecal, installed by the module).
click-left = gsimplecal &

[module/pulseaudio]
type = internal/pulseaudio
;; Works against PipeWire's pulse server too — that is the point of pipewire-pulse.
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${color.muted}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${color.accent}
click-right = pavucontrol &

[module/backlight]
type = internal/backlight
;; Auto-detects the first /sys/class/backlight device on polybar >= 3.7.
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${color.yellow}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = 󰻠 %percentage:2%%
label-foreground = ${color.green}

[module/memory]
type = internal/memory
interval = 5
format = <label>
;; GiB used, not a percentage. On a 4 GB machine "62%" and "2.4G" are the same
;; fact, but only one of them tells you whether the next browser tab fits.
label = 󰍛 %gb_used%
label-foreground = ${color.blue}

;; internal/temperature is deliberately not used: it takes `thermal-zone = N` or
;; a literal hwmon path, and this laptop has no /sys/class/thermal/thermal_zone*
;; at all - the module disabled itself and the bar silently lost its
;; temperature. hwmon numbers also move between boots. scripts/cpu-temp.sh
;; resolves coretemp/k10temp by name instead; see its header.
[module/cputemp]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-temp.sh
interval = 5
format = <label>
label = 󰔏 %output%°
label-foreground = ${color.orange}

[module/swap]
;; Prints nothing at all when the machine has no swap, so the module collapses
;; rather than showing a permanent 0G. See scripts/swap.sh.
type = custom/script
exec = ~/.config/polybar/scripts/swap.sh
interval = 10
format = <label>
label = 󰓡 %output%
label-foreground = ${color.accent-dim}

[module/fs]
;; Free space on the system drive - free, not used: "41G" answers the question
;; you actually have when an update or a download is about to run.
type = internal/fs
mount-0 = /
interval = 60
fixed-values = true
format-mounted = <label-mounted>
label-mounted = 󰋊 %free%
label-mounted-foreground = ${color.cyan}
;; An unmounted /, if it ever happens, is not something to render as blank.
format-unmounted = <label-unmounted>
label-unmounted = 󰋊 ?
label-unmounted-foreground = ${color.urgent}

[module/eth]
;; The wired half. Disconnected renders as nothing rather than as "off": on a
;; laptop the cable is normally out, and a permanent placeholder costs bar width
;; for a non-event. The wireless module below does show `off`, because there the
;; radio being down IS worth seeing.
type = internal/network
interface-type = wired
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
;; Plain ↓/↑ rather than Nerd Font arrows: they live in the text font, so the
;; direction never depends on a fallback being present.
label-connected = 󰈀 ↓%downspeed:6% ↑%upspeed:6%
label-connected-foreground = ${color.green}
label-disconnected =
click-left = nm-connection-editor &

[module/wlan]
type = internal/network
;; MONITOR-style env override: set INTERFACE in ~/.config/xprofile.d/99-local.sh
;; if auto-detection picks the wrong device.
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = 󰖩 %essid% ↓%downspeed:6% ↑%upspeed:6%
label-connected-foreground = ${color.accent}
label-disconnected = 󰖪 off
label-disconnected-foreground = ${color.muted}
click-left = nm-connection-editor &

[module/battery]
type = internal/battery
full-at = 98
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 10
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-low-foreground = ${color.urgent}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
animation-charging-0 = 󰁺
animation-charging-1 = 󰁾
animation-charging-2 = 󰂂
animation-charging-framerate = 700

[module/systray]
;; polybar >= 3.7 has a real tray module. Exactly one bar may own the systray
;; selection — a second one silently shows nothing (i3-sugg §12.9).
type = internal/tray
;; Sized in px against the bar's 20px, not as a percentage. Tray icons are
;; drawn by their own applications (nm-applet, udiskie) at whatever size they
;; are handed; ask for one that leaves no vertical room and they are clipped
;; flat top and bottom - which is what "the usb and wired icons are cropped"
;; is. 16px in a 20px bar leaves 2px above and below.
format-margin = 4pt
tray-spacing = 6pt
tray-size = 16px

[module/powermenu]
;; The "start button": sleep / reboot / shutdown, at the right end of the bar.
;; type = custom/text, not a menu: polybar's own internal/menu draws its entries
;; INTO the bar, which at 16px is a row of unreadable slivers and needs a second
;; click to dismiss. This hands the choice to the same rofi menu $mod+Shift+e
;; already opens (i3/scripts/rofi-powermenu.sh), so there is one power menu in
;; the session, themed by the rice, and the bar entry is just another way in.
type = custom/text
format = <label>
;; nf-md-power, the same glyph the menu's shutdown card uses - and the same
;; icon family as every other module here. U+23FB (the bare Unicode power
;; symbol) is not in the Nerd Font's patched set and falls through to whichever
;; fallback has it, which is how you get one icon in a different weight.
label = 󰐥
label-foreground = ${color.accent}
label-padding = 1
click-left = ~/.config/i3/scripts/rofi-powermenu.sh &
