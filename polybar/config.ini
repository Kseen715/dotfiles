;; polybar/config.ini — dotfiles-owned base layer (os-rice §5).
;; Geometry, fonts and which modules appear. Colors come from colors.ini, which
;; the rice owns and swaps on a rice switch — nothing in this file is a hex code.

[settings]
screenchange-reload = true
pseudo-transparency = false
compositing-background = source
compositing-foreground = over
compositing-border = over

[global/wm]
margin-bottom = 0
margin-top = 0
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 20px
radius = 0
bottom = false
fixed-center = true
wm-restack = i3
enable-ipc = true

background = ${color.background}
foreground = ${color.foreground}

line-size = 2px
border-size = 0pt
padding-left = 2
padding-right = 2
module-margin = 1

;; JetBrainsMono Nerd Font is installed by modules/theming.sh; the symbol-only
;; fallback covers glyphs a patched font can still miss, and Noto Color Emoji is
;; last so emoji in window titles do not render as tofu.
;;
;; Sized to the 20px bar. The trailing number is the vertical offset, and it is
;; what actually centers each font: they have different ascents, so one offset
;; for all three leaves the icon fonts sitting low.
;;
;; font-1 is deliberately NOT bigger than the text font. A fallback font asked
;; for at a size taller than the bar's usable height gets drawn at that size and
;; the bar simply ends - which is what clips an icon flat across the top and
;; bottom. It was 13pt in a 34pt bar, kept at 10pt when the bar went to 16px,
;; and that is where the tray/status glyphs started losing their edges.
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=9;2"
font-1 = "Symbols Nerd Font:size=9;2"
font-2 = "Noto Color Emoji:scale=9;2"

modules-left = i3 xwindow
modules-center = date
modules-right = pulseaudio backlight cputemp cpu memory swap fs eth wlan battery systray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

[bar/secondary]
;; Every output after the first. Identical to main minus the tray: the systray
;; selection can only be owned by one bar, and two bars fighting for it is the
;; classic "my tray icons vanished" bug (i3-sugg §12.9).
inherit = bar/main
modules-right = pulseaudio backlight cputemp cpu memory swap fs eth wlan battery powermenu
