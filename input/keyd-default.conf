# /etc/keyd/default.conf — seeded once by modules/input.sh, then yours.
#
# keyd remaps at the kernel level, so these work in a TTY, in a game that grabs
# the keyboard, and under Wayland — unlike xcape/xmodmap, which are X11-only.
#
# Conservative on purpose: one dual-role key, nothing that can lock you out.
# Reload after editing with: keyd reload

[ids]
*

[main]
# Tap Caps Lock for Escape, hold it for Ctrl. The single most useful remap on a
# tiling desktop, and it costs a key nobody uses.
capslock = overload(control, esc)
