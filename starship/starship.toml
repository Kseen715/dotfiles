# Shared BASE starship config for every os-rice rice. The ONLY thing that varies
# per rice is the color palette: os-rice composes the installed
# ~/.config/starship.toml as this body with the `[palettes.theme]` table at the
# bottom replaced by the active rice's colors
# (rices/<rice>/config/starship.palette.toml). Edit prompt structure/symbols
# here; edit per-rice colors there. Themed styles below reference the palette
# names accent/success/error/secondary rather than hardcoded colors.
add_newline = false
palette = "theme"

format = """$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$all\
$character"""

[username]
show_always = true
format = '[$user ]($style)'
style_user = "success"
disabled = false

[os]
disabled = false
style = 'accent'

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[cmd_duration]
format = "[$duration]($style) "
style = "white bold"

[character]
success_symbol = "[](bold success)"
error_symbol = "[✗](bold error)"
disabled = false

[directory]
style = "bold accent"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Scripts" = "󰲋 "

[hostname]
ssh_symbol = " "
format = '[$ssh_symbol$hostname]($style) '

[fossil_branch]
symbol = " "
format = '[$symbol$branch]($style) '

[hg_branch]
symbol = " "
format = '[$symbol$branch(:$topic)]($style) '

[pijul_channel]
symbol = " "
format = '[$symbol$channel]($style) '

[git_branch]
style = "bold secondary"
symbol = " "
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_commit]
tag_symbol = ' '
format = '[\($hash$tag\)]($style) '

# Langs and stuff

[custom.1c]
symbol = "1C "
style = 'bold yellow'
format = '[$symbol($output)]($style) '
detect_extensions = ['1cd', 'cfl', 'lgf', 'lpg', 'bsl']
disabled = false

[custom.ada]
symbol = "Ada "
style = 'bold yellow'
format = '[$symbol($output )]($style)'
detect_extensions = ['ada', 'adc', 'ads', 'adb']
command = "gnatmake --version 2>/dev/null | sed -n 's/.*GNATMAKE[ \\t]*\\([0-9.]*\\).*/\\1-gnat/p'"
disabled = false

[aws]
symbol = "󰸏 "
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
disabled = false

[buf]
symbol = " "
format = '[$symbol($version )]($style)'
disabled = false

[bun]
symbol = " "
format = '[$symbol($version )]($style)'
disabled = false

[c]
disabled = true

[custom.c]
symbol = " "
style = 'bold 149'
format = '[$symbol($output )]($style)'
detect_extensions =[ "c", "h", "cu" ]
command = "for c in gcc clang tcc; do command -v $c >/dev/null 2>&1 && $c -v 2>&1 | sed -nE 's/.*(gcc|clang|tcc) version ([0-9.]+).*/v\\2-\\1/p' | head -n 1; done | xargs"
disabled = false

[custom.c3]
symbol = "C3 "
style = 'bold blue'
format = '[$symbol($output )]($style)'
detect_extensions = ['c3']
command = "c3c --version 2>/dev/null | sed -n 's/.*C3 Compiler Version:[ \\t]*\\([0-9.]*\\).*/\\1/p'"
disabled = false

[custom.cuda]
symbol = "CU "
style = 'bold green'
format = '[$symbol($output )]($style)'
detect_extensions = ['cu']
command = "nvcc --version | sed -n 's/.*release \\([0-9]\\+\\.[0-9]\\+\\).*/v\\1/p'"
disabled = false

