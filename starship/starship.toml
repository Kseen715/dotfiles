# --- theme palette (rice-owned) ----------------------------------------------
# The ONE thing that varies per rice. os-rice replaces THIS table with the active
# rice's colors (rices/<rice>/config/starship.palette.toml) when composing the
# installed config. Keep it LAST in this file — the composer strips from this
# header to EOF. Standalone (uncomposed), these defaults keep the prompt working.
[palettes.theme]
accent = "cyan"
success = "green"
error = "red"
secondary = "yellow"
