name: os-rice CI

on:
  push:
    branches: [main] # main only — feature branches are covered by their PR run
    tags: ["**"] # every tag (release gating)
  pull_request: # every PR (feature-branch commits land here, not in push)
  workflow_call: # lets release.yml run this as a prerequisite gate

permissions:
  contents: read

jobs:
  # Fast, no-container gate: POSIX lint (dash -n + shellcheck) + unit tests.
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash, shellcheck, zsh
        run: sudo apt-get update -q && sudo apt-get install -y dash shellcheck zsh
      - name: Lint + unit tests
        run: sh os-rice/osr test

  # The idempotency matrix: one GitHub job per distro image, each installing the
  # rice TWICE in that image. The double run must be all-skips with no duplicate
  # PATH entries (DESIGN §9). The test itself is test/matrix-run.sh, the same
  # script test/matrix.sh runs locally -- here it is launched directly, one image
  # per job, so a failure is annotated against that image and its log is the
  # plain container output rather than a rendered table.
  idempotency-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:jammy
          - ubuntu:noble
          - ubuntu:resolute
          - debian:stable-slim
          - alpine:latest
          - archlinux:latest
          - fedora:latest
    steps:
      - uses: actions/checkout@v4
      # The checkout goes in read-only -- the test must not write into the tree
      # it is testing -- with a tmpfs over os-rice/build, which is the one path
      # that HAS to be writable: os-rice is a C program and `osr` builds it
      # before it runs anything. exec, because what is built there is then run.
      - name: Double-run install on ${{ matrix.image }}
        run: |
          # The mountpoint has to exist before the tmpfs can go over it, and a
          # fresh checkout has no build/ -- the engine cannot create it either,
          # the mount it would create it in being read-only.
          mkdir -p os-rice/build
          docker run --rm -e HOME=/root \
            -v "$GITHUB_WORKSPACE":/dotfiles:ro \
            --tmpfs /dotfiles/os-rice/build:rw,exec \
            "${{ matrix.image }}" \
            sh /dotfiles/os-rice/test/matrix-run.sh gruvbox
