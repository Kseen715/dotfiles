name: os-rice release

# Cutting a release is "run the whole test suite, then ship what it blessed",
# so the trigger is the same event that already means `main` is believed good:
# a push to main. Every such push produces a release -- there is no separate
# "release branch" or approval step in this repo to hang one off, and a
# version scheme that counts per day (below) is built for exactly that cadence.
#
# workflow_dispatch is the manual escape hatch: re-cut after a runner outage,
# or ship a build from main without an intervening commit.
#
# Deliberately NOT `push: tags:`. This workflow CREATES the tag; triggering on
# tag push would make it re-enter itself on its own output. Tags are already
# covered on the CI side -- os-rice-ci.yml runs on `tags: ["**"]` -- so a tag
# still gets tested, it just does not cut a second release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The version below is derived from the tags that exist WHEN THE RELEASE JOB
# RUNS, so two of these in flight at once is a race: both read the same day's
# tags, both compute the same N, and the second `gh release create` fails on a
# tag that now exists -- after its nine builds have already been paid for.
# Serialized rather than cancelled: cancel-in-progress would be right for a
# CI check, where only the newest commit's answer matters, but a release is a
# side effect on the outside world, and killing one between `gh release
# create` and its upload would leave a tag with no binaries on it.
concurrency:
  group: os-rice-release
  cancel-in-progress: false

# Read by default; only the job that actually creates the tag and the release
# gets write, and it gets it on the job rather than here so a compromised
# build step (which runs a compiler over the tree, i.e. arbitrary code) cannot
# reach the contents scope.
permissions:
  contents: read

jobs:
  # The gate. Not a copy of the test matrix -- the actual file, called as a
  # reusable workflow, which is what the `workflow_call:` trigger in
  # os-rice-ci.yml exists for. A drifting duplicate would be worse than no
  # gate at all: it would report green for a suite nobody maintains.
  test:
    uses: ./.github/workflows/os-rice-ci.yml

  # One job per shipped binary, on a Linux runner, because nob.c picks its
  # target purely from $CC (see target_windows() / target_needs_own_tls()) --
  # cross-compiling is the normal way this tree is built, not a special case,
  # and a Linux runner can produce all nine artifacts.
  #
  # The exception is the HOST for the two aarch64 Linux legs, which is an
  # aarch64 runner (`runner:` below, defaulting to ubuntu-latest). The Windows
  # legs stay cross-compiled: a PE file does not care which machine linked it,
  # and what a Windows runner would add -- actually executing the thing -- is
  # what os-rice-ci.yml's windows-latest and windows-11-arm jobs already do.
  #
  # Two toolchain families, for two different reasons:
  #
  # zig cc, for the six Linux targets. Ubuntu's cross packages give you the
  # arch but not the libc: there is no apt route to a musl aarch64 or a musl
  # i386 binary, and gluing three gcc cross packages to three musl-cross
  # toolchains is six installs of two shapes. `zig cc -target <arch>-linux-
  # <gnu|musl>` is one binary that ships every libc/arch pair, and it is
  # already on nob.c's own compiler ladder, so it is not a new dependency in
  # spirit. $CC is tokenized into words by nob.c (split_words, CC_MAX_WORDS),
  # so the multi-word "zig cc -target ..." form works as $CC -- verified.
  #
  # mingw-w64 from apt, for Windows x86_64 and x86, because for those two the
  # toolchain NAME is load-bearing. nob.c reads the target off $CC's program
  # name: "mingw" in it selects the Windows source set, and an i686-/i386-
  # prefix specifically selects the XP tier, which links the vendored BearSSL
  # so HTTPS works on a box whose schannel stops at TLS 1.0. `zig cc` would
  # present nob.c with the program name "zig", which settles neither -- the
  # 32-bit build would silently come out as a modern-Windows binary. Using the
  # triple-named drivers gets both decisions right with no overrides.
  #
  # Windows aarch64 is the one target with no apt mingw driver at all
  # (gcc-mingw-w64 ships x86_64 and i686 only). Rather than pull in llvm-mingw
  # as a third toolchain for one artifact, it goes through zig -- and since
  # "zig" tells nob.c nothing about the target, NOB_TARGET=windows says it
  # explicitly. That override exists in nob.c for precisely this case ("for a
  # toolchain whose name says nothing", target_windows()). No XP concern here:
  # Windows-on-ARM is modern by construction, which is also what nob.c's
  # name-based tier detection concludes on its own.
  build:
    needs: test
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: os-rice
    strategy:
      fail-fast: false
      matrix:
        include:
          # `expect` is an ERE matched against file(1)'s description of the
          # binary, asserted below. It carries the two things a wrong $CC
          # would get wrong silently: the ARCHITECTURE, and -- on Linux --
          # the LIBC, which is visible as the linkage (zig's musl targets
          # come out statically linked, its glibc targets dynamic with an
          # interpreter). Without the libc half, a typo in one -target could
          # ship the same glibc binary under both names and nothing would
          # notice. Patterns are deliberately loose about everything else:
          # section counts and file(1)'s exact phrasing move between versions,
          # and a release must not fail because the runner's file was upgraded.
          - slug: linux-x86_64-glibc
            cc: zig cc -target x86_64-linux-gnu
            expect: 'ELF 64-bit.*x86-64.*dynamically linked'
          - slug: linux-x86_64-musl
            cc: zig cc -target x86_64-linux-musl
            expect: 'ELF 64-bit.*x86-64.*statically linked'
          # The two aarch64 legs build on an aarch64 runner, so `zig cc
          # -target aarch64-linux-*` is a NATIVE build here, not a cross one.
          # Same driver and same -target as before -- keeping them explicit is
          # what makes the glibc/musl split a property of the matrix rather
          # than of whatever libc the host happens to have -- but the compiler
          # now sees the machine the artifact is for, and the CI gate above
          # has already run the suite on that machine.
          - slug: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            cc: zig cc -target aarch64-linux-gnu
            expect: 'ELF 64-bit.*aarch64.*dynamically linked'
          - slug: linux-aarch64-musl
            runner: ubuntu-24.04-arm
            cc: zig cc -target aarch64-linux-musl
            expect: 'ELF 64-bit.*aarch64.*statically linked'
          - slug: linux-x86-glibc
            cc: zig cc -target x86-linux-gnu
            expect: 'ELF 32-bit.*80386.*dynamically linked'
          - slug: linux-x86-musl
            cc: zig cc -target x86-linux-musl
            expect: 'ELF 32-bit.*80386.*statically linked'
          - slug: windows-x86_64
            cc: x86_64-w64-mingw32-gcc
            apt: gcc-mingw-w64-x86-64
            exe: .exe
            expect: 'PE32\+.*x86-64'
            bearssl: absent
          # The XP tier asserted, not assumed -- but asserted through `bearssl`
          # below rather than through file(1). nob.c's i686- driver-name
          # detection also stamps subsystem 4.00 (x86_64 gives 5.02, ARM64
          # 6.00), which would have been the obvious thing to match on, except
          # that the runner's file(1) does not print the subsystem for PE at
          # all -- it says `PE32 executable (console) Intel 80386, for MS
          # Windows` where a local file 5.46 says `PE32 executable for MS
          # Windows 4.00 (console), Intel i386`. So `expect` here checks only
          # what both versions agree on: 32-bit x86 PE.
          - slug: windows-x86
            cc: i686-w64-mingw32-gcc
            apt: gcc-mingw-w64-i686
            exe: .exe
            expect: 'PE32 .*(80386|i386)'
            bearssl: present
          # -s in $CC rather than a strip pass below: nothing on the runner
          # strips an ARM64 PE (GNU strip is x86-only for mingw, `zig objcopy`
          # is ELF-only), and this is the one leg whose checks below do not
          # read symbols out of the image, so it can be linked stripped.
          - slug: windows-aarch64
            cc: zig cc -s -target aarch64-windows-gnu
            nob_target: windows
            exe: .exe
            expect: 'PE32\+.*([Aa]arch64|ARM64)'
            bearssl: absent
    steps:
      - uses: actions/checkout@v7

      # Only the two mingw legs need apt; the zig legs get their whole
      # toolchain from setup-zig, so this step is skipped for six of nine.
      - name: Install ${{ matrix.apt }}
        if: matrix.apt != ''
        run: sudo apt-get update -q && sudo apt-get install -y ${{ matrix.apt }}

      # setup-zig rather than curl-ing ziglang.org: it knows the community
      # mirrors (upstream's own host has rate-limited CI before) and caches the
      # toolchain between runs. Version pinned, not "master" -- a release
      # artifact should not change because an unrelated compiler did.
      - name: Install zig
        if: matrix.apt == ''
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # build/ is the one directory nob cannot create for itself: it is where
      # nob itself goes. Bootstrap with the host cc (nob.c is build-time
      # tooling and always runs on the runner), then run it with $CC set to
      # the cross driver -- which is the entire cross-compilation interface.
      - name: Build ${{ matrix.slug }}
        env:
          CC: ${{ matrix.cc }}
          NOB_TARGET: ${{ matrix.nob_target }}
        run: |
          mkdir -p build
          cc -o build/nob nob.c
          ./build/nob

      # An ASSERTION, not a print. Cross-compilation here is driven entirely by
      # the name and flags of $CC, so every way this can go wrong produces a
      # binary that builds and links perfectly and is simply for the wrong
      # machine -- or, on the windows-x86 leg, for the right machine without
      # the TLS stack that tier needs. None of that is visible in the build
      # log. `file` is the only step that looks at what was actually produced,
      # so it has to be able to fail the job.
      - name: Check the binary is for the target we asked for
        run: |
          desc=$(file -b build/osr${{ matrix.exe }})
          echo "$desc"
          echo "$desc" | grep -Eq '${{ matrix.expect }}' || {
            echo "::error::${{ matrix.slug }}: expected /${{ matrix.expect }}/, got: $desc"
            exit 1
          }

      # The XP tier, checked by what it actually changes. nob.c decides that
      # tier off $CC's program name (target_needs_own_tls: `i686`/`i386` in
      # it), and the consequence is that the vendored BearSSL gets linked in,
      # because XP's schannel stops at TLS 1.0. If an apt rename ever made
      # $CC stop matching, this leg would still build and still be a valid
      # 32-bit binary -- it would just quietly lose HTTPS on the one OS the
      # tier exists for. Grepping the linked image for a BearSSL symbol is
      # the direct evidence, and unlike file(1)'s subsystem field it does not
      # depend on which version of file the runner happens to ship.
      - name: Check the TLS tier
        if: matrix.bearssl != ''
        run: |
          n=$(grep -ac 'br_ssl' build/osr${{ matrix.exe }} || true)
          case "${{ matrix.bearssl }}:$n" in
            present:0) echo "::error::${{ matrix.slug }}: vendored BearSSL missing; XP tier was not selected"; exit 1 ;;
            absent:0)  echo "no BearSSL, as expected" ;;
            present:*) echo "BearSSL linked, as expected" ;;
            absent:*)  echo "::error::${{ matrix.slug }}: vendored BearSSL linked in; this target should use schannel"; exit 1 ;;
          esac

      # Stripped HERE, after both checks and not with a link-time -s: the
      # BearSSL assertion above reads symbol names out of the linked image, so
      # stripping first would delete the evidence it needs. Re-running nob with
      # a different $CC is also not an option -- a changed compiler string is a
      # full rebuild by nob's own rule -- so this operates on the finished
      # binary. Tool per format: GNU strip for the mingw legs, `zig objcopy`
      # for ELF (it refuses COFF outright). windows-aarch64 has neither and was
      # linked stripped instead, so it is skipped.
      - name: Strip ${{ matrix.slug }}
        if: matrix.slug != 'windows-aarch64'
        run: |
          bin=build/osr${{ matrix.exe }}
          before=$(stat -c%s "$bin")
          case "${{ matrix.slug }}" in
            windows-x86_64) x86_64-w64-mingw32-strip "$bin" ;;
            windows-x86)    i686-w64-mingw32-strip "$bin" ;;
            *)              zig objcopy --strip-all "$bin" "$bin.stripped"
                            mv "$bin.stripped" "$bin" ;;
          esac
          echo "$bin: $before -> $(stat -c%s "$bin") bytes"

      # Uploaded under the bare target slug; the release job adds the version
      # to the filename once it has computed it. Doing it the other way would
      # need the version resolved before any build starts, i.e. an extra job
      # and an extra checkout, to rename nine files.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}
          path: os-rice/build/osr${{ matrix.exe }}
          if-no-files-found: error

  # Optional gate: does the tree still build under every front end the README
  # claims, and at what cost. One job per compiler and architecture. The
  # numbers are RATIOS against that host's gcc -- comparing a time measured on
  # one runner against a size measured on another would be meaningless -- so
  # each architecture carries its own gcc row and is rendered as its own
  # table; nothing is ever divided across the two.
  #
  # arm64 runs the three REQUIRED compilers only. gcc, clang and zig are the
  # ones that ship binaries, so their arm64 numbers are about a target the
  # release actually has. The courtesy front ends are x86_64-only by their own
  # nature rather than by choice here: lacc emits x86_64 and nothing else, pcc
  # has no aarch64 backend, and tcc's is not a thing to hang a release gate
  # on. A blank row for each of them on arm would say less than their absence.
  #
  # Four architectures, not two: the release ships three Windows binaries, and
  # until now no row in these tables was produced by a Windows compiler on a
  # Windows host at all -- the shipped PE files are cross-linked on Linux, and
  # nothing here said what building this tree natively costs. The Windows rows
  # are `runner:`-pinned like the arm64 ones and carry a `boot:` (see there);
  # everything downstream is the same script and the same TSV row.
  #
  # `required: true` on gcc, clang and zig: those three are the compilers CI
  # already builds and ships with, so a failure there is a real regression and
  # the release must not go out. Everything else is a courtesy row -- tcc,
  # pcc, lacc, cproc are C89 front ends of varying completeness, and one of
  # them breaking on a new upstream release is news for the notes, not a
  # reason to withhold nine binaries. Those legs record "failed to compile"
  # and exit 0.
  #
  # The awkward compilers are installed by os-rice itself (`osr module <x>`),
  # not hand-rolled here: the module is the thing that knows lacc needs its
  # preprocessor patch and that cproc wants QBE in the same prefix, and
  # duplicating that into a workflow would leave two copies to drift. pcc is
  # the exception -- it has no module, it is one apt package.
  ccbench:
    needs: test
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        # bash on the Windows legs too (the runner default there is pwsh), so
        # the one bench step below is a single script for every row.
        shell: bash
        working-directory: os-rice
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            slug: gcc
            name: '[gcc](https://gcc.gnu.org/)'
            cc: gcc
            required: true
          - arch: x86_64
            slug: clang
            name: '[clang](https://clang.llvm.org/)'
            cc: clang
            required: true
          - arch: x86_64
            slug: zig
            name: '[zig](https://ziglang.org/)'
            cc: zig cc
            zig: '0.14.1'
            required: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            slug: gcc
            name: '[gcc](https://gcc.gnu.org/)'
            cc: gcc
            required: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            slug: clang
            name: '[clang](https://clang.llvm.org/)'
            cc: clang
            required: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            slug: zig
            name: '[zig](https://ziglang.org/)'
            cc: zig cc
            zig: '0.14.1'
            required: true
          - arch: x86_64
            slug: tcc
            name: '[tcc](https://bellard.org/tcc/)'
            cc: tcc
            module: tcc
          - arch: x86_64
            slug: pcc
            name: '[pcc](http://pcc.ludd.ltu.se/)'
            cc: pcc
            apt: pcc
          - arch: x86_64
            slug: lacc
            name: '[lacc](https://github.com/larmel/lacc)'
            # The module symlinks its prefix into ~/.local/bin, which the
            # bench step puts on PATH.
            cc: lacc
            module: lacc
            note: 'C89 by design, own assembler and ELF writer'
          - arch: x86_64
            slug: cproc
            name: '[cproc](https://github.com/michaelforney/cproc) + [QBE](https://c9x.me/compile/)'
            cc: cproc
            module: cproc
            note: 'QBE built into the same prefix'
          # The Windows rows. `boot` exists for them: the Linux legs bootstrap
          # nob with the host `cc`, which Windows has no such thing as, and
          # MSVC additionally spells the whole command differently (/Fe:, /Fo)
          # -- that dialect split is nob.c's own (is_msvc_name), so the
          # bootstrap has to speak it before nob is there to.
          #
          # Courtesy rows, all four: none is `required`. What actually gates a
          # release on Windows is os-rice-ci.yml's unit-windows legs, which
          # build AND run the units under both dialects. These time the build.
          - arch: windows-x86_64
            runner: windows-latest
            slug: gcc
            name: '[mingw gcc](https://www.mingw-w64.org/)'
            cc: gcc
            boot: gcc -o build/nob.exe nob.c
            exe: .exe
          - arch: windows-x86_64
            runner: windows-latest
            slug: clang
            name: '[clang](https://clang.llvm.org/)'
            cc: clang
            boot: clang -o build/nob.exe nob.c
            exe: .exe
            note: 'MSVC ABI, GNU flag dialect'
          # cl.exe is the one front end here that is a different DIALECT rather
          # than a different compiler: nob.c spells every flag twice and only
          # this row exercises the /W4 /c /Fo half.
          - arch: windows-x86_64
            runner: windows-latest
            slug: msvc
            name: '[MSVC cl](https://learn.microsoft.com/cpp/build/reference/compiling-a-c-cpp-program)'
            cc: cl.exe
            boot: cl /nologo /Fe:build/nob.exe /Fobuild/ nob.c
            msvc: x64
            exe: .exe
          # Windows-on-ARM is MSVC only: the arm64 image ships Visual Studio
          # and no MinGW gcc, so this table has no gcc row and therefore no
          # BASE to divide by -- the renderer below prints its times bare.
          - arch: windows-arm64
            runner: windows-11-arm
            slug: msvc
            name: '[MSVC cl](https://learn.microsoft.com/cpp/build/reference/compiling-a-c-cpp-program)'
            cc: cl.exe
            boot: cl /nologo /Fe:build/nob.exe /Fobuild/ nob.c
            msvc: arm64
            exe: .exe
    steps:
      - uses: actions/checkout@v7

      - name: Install zig
        if: matrix.zig != ''
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install ${{ matrix.apt }}
        if: matrix.apt != ''
        run: sudo apt-get update -q && sudo apt-get install -y ${{ matrix.apt }}

      # cl.exe is only a compiler once vcvars has run, and a workflow `run:` is
      # its own process -- so the environment has to come from a step that
      # exports into the job, not from a `call vcvarsall.bat` the next step
      # would never see. That is all this action does; `arch` names the
      # host/target pair the way the vcvars script name does in os-rice-ci.yml.
      - name: Set up MSVC (${{ matrix.msvc }})
        if: matrix.msvc != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      # `osr module` builds osr first with whatever the ladder finds, then
      # installs the compiler; the bench below re-bootstraps nob and cleans,
      # so nothing that happens here is timed.
      - name: Install ${{ matrix.module }} via osr
        if: matrix.module != ''
        run: sh osr module ${{ matrix.module }}

      # nob -t is serial and times every command it issues -- so it has to be
      # given something to issue. `nob clean` first, or an up-to-date tree
      # reports nothing at all (nob.c: "an up-to-date tree runs nothing and
      # reports nothing"). The total line and the size come off stderr; the
      # size is re-read with stat because bytes divide and "1.2M" does not.
      #
      # A failing optional compiler still has to leave a row behind, which is
      # why the whole thing is `|| ok=0` rather than `set -e`.
      - name: Time ${{ matrix.slug }} (${{ matrix.arch }})
        env:
          CC: ${{ matrix.cc }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ok=1 secs=0 bytes=0
          nob=./build/nob${{ matrix.exe }}
          mkdir -p build
          ${{ matrix.boot || 'cc -o build/nob nob.c' }} || ok=0
          if [ $ok = 1 ]; then $nob clean || ok=0; fi
          if [ $ok = 1 ]; then CC="$CC" $nob -t 2>build/time.log || ok=0; fi
          if [ $ok = 1 ]; then
            cat build/time.log
            # tr -d '\r': a native Windows nob.exe writes its stderr in text
            # mode, so every line of the log arrives CRLF-terminated and the
            # anchored sed below would match nothing at all.
            secs=$(tr -d '\r' <build/time.log | sed -n 's/^  total  *\([0-9.]*\)s$/\1/p' | tail -1)
            bytes=$(stat -c %s build/osr${{ matrix.exe }} 2>/dev/null || echo 0)
            [ -n "$secs" ] && [ "$bytes" != 0 ] || ok=0
          fi
          # zig cc reports "clang version 19.1.7 (https://github.com/ziglang/
          # zig-bootstrap ...)" -- a URL is noise in the table and cut(1) would
          # leave half of it dangling. Drop parentheticals holding a URL only;
          # gcc's "(Ubuntu 13.3.0-6ubuntu2~24.04.1)" is the distro build and stays.
          # 2>&1, not 2>/dev/null: cl.exe has no --version and prints its
          # banner (the only version string it has) on stderr before
          # complaining about the flag. head -1 takes the banner either way.
          # The MSVC banner spends its first 39 characters on the product
          # name before reaching a version number, which cut -c1-60 would then
          # amputate; drop that prefix so the column holds the version.
          ver=$($CC --version 2>&1 | head -1 \
                | sed 's|^Microsoft (R) C/C++ Optimizing Compiler ||; s| *([^()]*://[^()]*)||g; s|  *| |g; s| *$||' \
                | cut -c1-60)
          [ -n "$ver" ] || ver='-'
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            '${{ matrix.arch }}' '${{ matrix.slug }}' '${{ matrix.name }}' "$(( 1 - ok ))" \
            "${secs:-0}" "$bytes" "$ver" '${{ matrix.note || '-' }}' > row.tsv
          cat row.tsv
          # A required compiler that cannot build the tree fails the release.
          [ $ok = 1 ] || [ '${{ matrix.required }}' != true ]

      - uses: actions/upload-artifact@v7
        with:
          name: ccbench-${{ matrix.arch }}-${{ matrix.slug }}
          path: os-rice/row.tsv
          if-no-files-found: error

  release:
    needs: [build, ccbench]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only write scope in the file, and only here: this job runs no
    # compiler and no repository code, it renames files and calls `gh`.
    permissions:
      contents: write
    steps:
      # fetch-depth 0 + fetch-tags because the version below is computed FROM
      # the existing tags; a default shallow checkout has none of them, and
      # would happily hand out .1 every single time.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # v<YYYYMMDD>.<N>, N counting releases within the UTC day.
      #
      # Not github.run_number: that counts runs of this workflow for the life
      # of the repository and never resets, so it would pair a correct date
      # with a meaningless ordinal (v20260908.417). The day's own tags are the
      # only authority on how many releases that day has had.
      #
      # max+1, not count+1: a tag deleted by hand would make a count reuse a
      # version that already existed in someone's checkout. UTC, because the
      # runner's clock is UTC and a local-time date would put two different
      # days' releases under one label depending on where it ran.
      - name: Compute version
        id: v
        run: |
          day=$(date -u +%Y%m%d)
          last=$(git tag -l "v$day.*" | sed "s/^v$day\.//" | sort -n | tail -1)
          echo "tag=v$day.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # download-artifact lays each artifact out as artifacts/<name>/osr[.exe],
      # so the directory name IS the target slug -- rename into a flat dist/
      # with the version in the filename, which is what someone who downloaded
      # three of these into ~/Downloads needs to tell them apart.
      #
      # SHA256SUMS is written last and with bare filenames (cd dist), so
      # `sha256sum -c SHA256SUMS` works in whatever directory the user
      # unpacked the release into.
      - name: Assemble release files
        run: |
          mkdir dist
          for d in artifacts/*/; do
            slug=$(basename "$d")
            for f in "$d"osr*; do
              # artifacts/ also holds the ccbench-* rows, which match no
              # osr* -- an unmatched glob comes back as its own literal.
              [ -e "$f" ] || continue
              case "$f" in *.exe) ext=.exe ;; *) ext= ;; esac
              cp "$f" "dist/osr-${{ steps.v.outputs.tag }}-$slug$ext"
            done
          done
          chmod +x dist/*
          cd dist && sha256sum osr-* > SHA256SUMS
          cat SHA256SUMS

      # The compiler tables, assembled here rather than in the bench jobs
      # because it is the only place that has every row at once -- and the
      # ratios are meaningless without that architecture's gcc row to divide
      # by. Rows come pre-sorted (successes first, then by time) so awk can
      # print in input order and stay a one-pass script.
      #
      # One table per architecture, filtered on the row's own arch column: an
      # x86_64 second and an arm64 second are different seconds, and a single
      # merged table with one BASE would silently be claiming otherwise. The
      # same holds twice over for the Windows hosts, whose fastest row is a
      # different compiler on a different OS. windows-arm64 has no gcc at all,
      # so its table has no BASE and its times print unratioed -- which the
      # `bs > 0` guard below already handled.
      - name: Render the compiler tables
        run: |
          {
            echo "Built from ${{ github.sha }}. Verify with \`sha256sum -c SHA256SUMS\`."
            for a in x86_64:ubuntu-latest arm64:ubuntu-24.04-arm \
                     windows-x86_64:windows-latest windows-arm64:windows-11-arm; do
              arch=${a%:*} host=${a#*:}
              echo
              echo "#### Compiler autotests ($arch, $host)"
              echo
              echo "Lower x is faster/smaller. Ratios, where shown, are against this runner's gcc."
              echo
              echo "| Compiler | Version | Notes | _Compilation time_ | Output size |"
              echo "| --- | --- | --- | --- | --- |"
              cat artifacts/ccbench-*/row.tsv |
                awk -F'\t' -v arch="$arch" '$1 == arch' |
                sort -t"$(printf '\t')" -k4,4n -k5,5g |
                awk -F'\t' '
                  { n++; f[n]=$0; if ($2 == "gcc" && $4 == 0) { bs=$5; bz=$6 } }
                  END {
                    for (i = 1; i <= n; i++) {
                      split(f[i], c, "\t")
                      if (c[4] != 0) {
                        printf "| %s | %s | %s | _failed to compile_ | - |\n", c[3], c[7], c[8]
                        continue
                      }
                      t = sprintf("%.3fs", c[5]); z = sprintf("%.0f KiB", c[6] / 1024)
                      if (c[2] == "gcc") { t = t " **BASE**"; z = z " **BASE**" }
                      else if (bs > 0) {
                        t = sprintf("%s %.3fx", t, c[5] / bs)
                        z = sprintf("%s %.3fx", z, c[6] / bz)
                      }
                      printf "| %s | %s | %s | %s | %s |\n", c[3], c[7], c[8], t, z
                    }
                  }'
            done
          } > notes.md
          cat notes.md

      # `gh release create` creates the tag itself, at this commit, as part of
      # making the release -- so there is no separate `git tag && git push`,
      # and no window where a tag exists with no release attached to it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file notes.md \
            dist/*
