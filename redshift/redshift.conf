; redshift/redshift.conf — dotfiles-owned (os-rice §5). A personal preference,
; not a rice theme, so a rice switch leaves it alone.
;
; The location is set manually on purpose: the geoclue provider needs a D-Bus
; service i3 does not run, and redshift refuses to start without a location.

[redshift]
temp-day=6500
temp-night=3600
transition=1
brightness-day=1.0
brightness-night=0.9
gamma=1.0
adjustment-method=randr
location-provider=manual

[manual]
; Moscow. Change to yours — `redshift -p` prints what it resolves to.
lat=55.75
lon=37.62
